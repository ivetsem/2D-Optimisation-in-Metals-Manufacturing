[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutting-benchmark"
version = "0.1.0"
dependencies = [
    "pandas",
    "rectpack",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
notebooks = [
    "ipykernel",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]